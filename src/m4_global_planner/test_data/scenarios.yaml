# FLY-only geometric requests; original scenario endpoints are unchanged.
fly_benchmark:
  repeats: 3
  seeds: [11, 29, 47]
  timeout_seconds: 120
  anchor_overrides:
    transition_spatial_resolution: 2.0
    transition_heading_resolution_deg: 45
    max_sampled_walk_states: 10000
  graph: &fly_graph_settings
    connection_radius: 2.5
    max_neighbors: 16
    distance_cost_per_meter: 1.0
    max_nodes: 15000
    max_edges: 300000
    max_connection_attempts: 300000
    max_lattice_cells: 100000
  sweep:
    coarse: &fly_coarse_settings
      coarse_resolution: 2.0
      fine_resolution: 0.5
      samples: 256
      max_sample_attempts: 30000
    fine:
      coarse_resolution: 2.0
      fine_resolution: 0.25
      samples: 1024
      max_sample_attempts: 30000
  cases:
    - {scenario: F01_open_3d, expected: success, positions: [[1, 1, 1], [7, 5, 3]]}
    - {scenario: F02_blocked_flight_segment, expected: success, positions: [[1, 2, 2], [7, 2, 2]]}
    - {scenario: F03_low_ceiling, expected: success, positions: [[1, 2, 0.5], [5, 2, 0.5]]}
    - {scenario: F04_overhead_obstacle, expected: success, positions: [[1, 2, 1], [5, 2, 1]]}
    # The middle anchor explicitly requests the scenario's higher route.
    - {scenario: F05_narrow_3d_opening, expected: success, positions: [[2, 3, 2], [6, 3, 2]]}
    - {scenario: F06_multiple_altitudes, expected: success, positions: [[1, 2, 1], [4, 2, 2.2], [7, 2, 1]]}
    - {scenario: G01_no_path, expected: no_path, positions: [[2, 3, 1], [8, 3, 1]]}
    - {scenario: G02_equal_cost_routes, expected: success, positions: [[1, 3, 1], [7, 3, 1]]}
    - {scenario: G04_large_open_world, expected: success, positions: [[1, 1, 1], [29, 29, 6]]}
    - {scenario: G05_dense_clutter, expected: success, positions: [[1, 1, 1], [11, 11, 1]]}
  unsupported:
    G03_shorter_but_more_expensive: WALK terrain costs have no defined FLY equivalent
    G06_unknown_region: shared FLY validator rejects unknown maps

# Complete finite geometric graph settings; no physical execution semantics.
joint_planner:
  replanning_policy: rebuild_dijkstra  # Full new snapshot; no incremental edge reuse.
  execution_policy: geometric_only  # Physical takeoff/landing/controller support is absent.
  cost_tolerance: 1.0e-10  # Relative and absolute route/edge cost audit tolerance.
  search_method: dijkstra  # Alternatives: astar, weighted_astar.
  weighted_astar_weight: 1.5  # Applied only by weighted_astar; finite and >= 1.
  endpoint_radius: 3.0
  fly_approach: adaptive_lattice
  fly_graph: *fly_graph_settings
  fly_tuning: *fly_coarse_settings
  walk_terrain_cost_mode: distance_density

joint_search_benchmark:
  repeats: 3
  seed: 11
  timeout_seconds: 180
  heuristic_tolerance: 1.0e-9
  cost_tolerance: 1.0e-7
  weighted_astar_weights: [1.5, 2.0]
  # Synthetic requests reuse existing worlds; all dimensions and costs are test values.
  requests:
    T01_open_transition:
      start: {mode: walk, position: [1, 2, 0], heading_deg: 0}
      goal: {mode: fly, position: [4, 2, 1]}
    T02_blocked_morphing_space:
      start: {mode: walk, position: [2.5, 2.5, 0], heading_deg: 0}
      goal: {mode: fly, position: [2.5, 2.5, 0]}
    T03_only_one_transition_zone:
      start: {mode: walk, position: [1, 2, 0], heading_deg: 0}
      goal: {mode: fly, position: [9, 2, 0]}
    T04_multiple_transition_choices:
      start: {mode: walk, position: [1, 2, 0], heading_deg: 0}
      goal: {mode: walk, position: [9, 2, 0], heading_deg: 0}
    G04_large_open_world:
      start: {mode: walk, position: [1, 1, 0], heading_deg: 0}
      goal: {mode: walk, position: [29, 29, 0], heading_deg: 0}
    G05_dense_clutter:
      start: {mode: walk, position: [1, 1, 0], heading_deg: 0}
      goal: {mode: walk, position: [11, 11, 0], heading_deg: 0}
    G01_no_path:
      start: {mode: walk, position: [2, 3, 0], heading_deg: 0}
      goal: {mode: walk, position: [8, 3, 0], heading_deg: 0}
  cases:
    - {name: T01, scenario: T01_open_transition, expected: success}
    - {name: T02, scenario: T02_blocked_morphing_space, expected: success}
    - {name: T03, scenario: T03_only_one_transition_zone, expected: success}
    - name: T04_low_penalty
      scenario: T04_multiple_transition_choices
      expected: success
      parameter_overrides: {transition_extra_cost: 0}
      planner_overrides: {fly_graph: {distance_cost_per_meter: 0.2}}
    - name: T04_high_penalty
      scenario: T04_multiple_transition_choices
      expected: success
      parameter_overrides: {transition_extra_cost: 100}
      planner_overrides: {fly_graph: {distance_cost_per_meter: 0.2}}
    - {name: T05, scenario: T05_flight_bridge, expected: success}
    - name: T05_roadmap
      scenario: T05_flight_bridge
      expected: success
      planner_overrides: {fly_approach: sparse_roadmap}
    - name: T05_one_way
      scenario: T05_flight_bridge
      expected: no_path
      parameter_overrides:
        transition_validation: {supported_directions: [walk_to_fly]}
    - {name: T06, scenario: T06_walk_only, expected: success}
    - name: G04_scale
      scenario: G04_large_open_world
      expected: success
      parameter_overrides:
        spatial_resolution: 1.0
        heading_resolution_deg: 90
        mandatory_anchors:
          transition_spatial_resolution: 1.0
          transition_heading_resolution_deg: 90
    - name: G05_clutter
      scenario: G05_dense_clutter
      expected: success
      parameter_overrides:
        spatial_resolution: 1.0
        heading_resolution_deg: 90
        mandatory_anchors:
          transition_spatial_resolution: 1.0
          transition_heading_resolution_deg: 90
    - {name: G01_disconnected, scenario: G01_no_path, expected: no_path}

# Provisional mock schema only; upstream 2D costmap + height format is unavailable.
height_grid_mock:
  resolution: 1.0
  origin: [0.0, 0.0]
  vertical_bounds: [0.0, 3.0]
  default_cost: 0.0  # Nonnegative extra WALK cost per meter, not occupancy probability.
  unknown_policy: block  # Unknown columns block both modes; reject_map is strict.
  inflation_policy: raw_geometry  # Footprints/margins belong to existing validators.
  height_reference: map_z
  # Cells are supplied by mock callers: rows[y][x], ground_height, occupied_intervals,
  # optional obstacle_top_height, cost, walk_forbidden, unknown.
  # occupied_intervals: [] means explicitly clear within vertical_bounds;
  # absent/null intervals mean unknown, even when an obstacle top is supplied.
